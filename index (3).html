<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equity Research Report Updates</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #243044;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 1.75rem;
      text-align: center;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 340px;
    }

    .search-box input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.4rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box::before {
      content: "⌕";
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1.1rem;
    }

    .stats {
      display: flex;
      gap: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .stats span {
      background: var(--card);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .ticker-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    details.ticker-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    details.ticker-card[open] {
      border-color: #475569;
    }

    details.ticker-card summary {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.1rem;
      cursor: pointer;
      list-style: none;
      user-select: none;
      transition: background 0.15s;
    }

    details.ticker-card summary::-webkit-details-marker {
      display: none;
    }

    details.ticker-card summary:hover {
      background: var(--card-hover);
    }

    .ticker-main {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
      flex: 1;
    }

    .ticker-code {
      font-weight: 700;
      font-size: 1rem;
      color: #93c5fd;
      min-width: 3.2rem;
    }

    .ticker-info {
      min-width: 0;
    }

    .ticker-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ticker-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .ticker-right {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      flex-shrink: 0;
    }

    .upside-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.05rem;
      min-width: 4.5rem;
    }

    .upside-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-weight: 500;
      line-height: 1;
    }

    .best-upside {
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.2;
    }

    .upside-pos { color: var(--green); }
    .upside-neg { color: var(--red); }
    .upside-zero { color: var(--muted); }

    .chevron {
      width: 1.1rem;
      height: 1.1rem;
      color: var(--muted);
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    details[open] .chevron {
      transform: rotate(180deg);
    }

    .reports-panel {
      border-top: 1px solid var(--border);
      background: #0f172a;
      padding: 0.4rem 0;
    }

    .reports-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .reports-table th {
      text-align: left;
      padding: 0.55rem 1rem;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
    }

    .reports-table td {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      vertical-align: middle;
    }

    .reports-table tr:last-child td {
      border-bottom: none;
    }

    .reports-table tr:hover td {
      background: rgba(59, 130, 246, 0.06);
    }

    .badge {
      display: inline-block;
      padding: 0.18rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge-hold {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    .badge-accumulate {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .price {
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .report-link {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .report-link:hover {
      background: rgba(59, 130, 246, 0.15);
      text-decoration: underline;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    footer {
      margin-top: 2.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .bulk-actions {
      display: flex;
      gap: 0.5rem;
    }

    .bulk-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .bulk-btn:hover {
      color: var(--text);
      border-color: #475569;
    }

    @media (max-width: 640px) {
      .ticker-right .upside-block {
        display: none;
      }

      .reports-table {
        font-size: 0.8rem;
      }

      .reports-table th,
      .reports-table td {
        padding: 0.5rem 0.7rem;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        max-width: none;
      }

      .stats {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

      ["SMSM","Selamat Sempurna","6M24","HOLD","2,128","2,000","6.40%","https://drive.google.com/file/d/1NDjHHv4XdTpEmWVFlNqq3IR8QlTDrX_Z/view?usp=sharing"],

      ["SMSM","Selamat Sempurna","6M26","ACCUMULATE","2,200","1,745","26.10%","https://drive.google.com/file/d/1N54ZsO_OGBH84-htBOsZZ4LB9bfi9eaW/view?usp=sharing"],
      ["SMSM","Selamat Sempurna","9M23","ACCUMULATE","2,452","1,890","29.70%","https://drive.google.com/file/d/1Zf5QyvJU7PV9J-p5bK4a69SPTLElYM7M/view?usp=sharing"],
      ["SMSM","Selamat Sempurna","9M24","ACCUMULATE","2,079","1,840","13.00%","https://drive.google.com/file/d/1RKl267fbdJ1HIV3PPxAVgBc7LANIeBxC/view?usp=sharing"],
      ["SMSM","Selamat Sempurna","12M24","HOLD","1,956","1,780","9.90%","https://drive.google.com/file/d/1RgobVZoUV605WFsbZAFxwjcv-yg6Cl_0/view?usp=sharing"],
      ["TOTL","Total Bangun Persada","3M24","ACCUMULATE","789","545","44.80%","https://drive.google.com/file/d/1rYUuFQlVL2AICtZsMS6-qUlMbK-sbqSg/view?usp=sharing"],
      ["TOTL","Total Bangun Persada","6M24","HOLD","639","605","5.60%","https://drive.google.com/file/d/1yEhWg25JhHUdalHe64fWPG0ybVKNyIB9/view?usp=sharing"],
      ["TOTL","Total Bangun Persada","6M25","ACCUMULATE","962","800","20.30%","https://drive.google.com/file/d/1LjiW7zWudms_efiBkzWh8POOmrphWCyA/view?usp=sharing"],
      ["TOTL","Total Bangun Persada","6M26","HOLD","1,450","1,470","-1.40%","https://drive.google.com/file/d/1u0Go9gTtkPFP9_YrsgjD1skA-B-geDtd/view?usp=sharing"],
      ["TOTL","Total Bangun Persada","9M24","ACCUMULATE","767","685","12.00%","https://drive.google.com/file/d/1YF5gMOZ1tqfhEt483AW-xGI9yqdIfhiU/view?usp=sharing"],
      ["TOTL","Total Bangun Persada","9M25","ACCUMULATE","1,215","985","23.40%","https://drive.google.com/file/d/13zCRTwAp10waVdMlPJ62NexQgYmz305k/view?usp=sharing"]
    ];

    function groupByTicker(rows) {
      const map = new Map();
      for (const row of rows) {
        const ticker = row[0];
        if (!map.has(ticker)) {
          map.set(ticker, {
            ticker,
            company: row[1],
            reports: []
          });
        }
        map.get(ticker).reports.push({
          period: row[2],
          recommendation: row[3],
          target: row[4],
          last: row[5],
          upside: row[6],
          url: row[7]
        });
      }

      const periodScore = (p) => {
        const m = p.match(/(\d+)M(\d+)/);
        if (!m) return 0;
        const months = parseInt(m[1], 10);
        const year = parseInt(m[2], 10);
        return year * 100 + months;
      };

      for (const group of map.values()) {
        group.reports.sort((a, b) => periodScore(b.period) - periodScore(a.period));
        // Use upside from the most recent report (already sorted first)
        group.latestUpside = parseFloat(group.reports[0].upside) || 0;
      }

      return Array.from(map.values()).sort((a, b) => a.ticker.localeCompare(b.ticker));
    }

    function upsideClass(val) {
      if (val > 0) return 'upside-pos';
      if (val < 0) return 'upside-neg';
      return 'upside-zero';
    }

    function formatUpside(val) {
      if (val === -Infinity) return '—';
      const sign = val > 0 ? '+' : '';
      return sign + val.toFixed(1) + '%';
    }

    function render(groups) {
      const container = document.getElementById('ticker-list');

      if (groups.length === 0) {
        container.innerHTML = '<div class="empty-state">No matching tickers found</div>';
        document.getElementById('ticker-count').textContent = '0 tickers';
        document.getElementById('report-count').textContent = '0 reports';
        return;
      }

      let totalReports = 0;

      container.innerHTML = groups.map(g => {
        totalReports += g.reports.length;
        const bestCls = upsideClass(g.latestUpside);

        const rowsHtml = g.reports.map(r => {
          const uVal = parseFloat(r.upside) || 0;
          const badgeCls = r.recommendation === 'HOLD' ? 'badge-hold' : 'badge-accumulate';
          return `
            <tr>
              <td><strong>${r.period}</strong></td>
              <td><span class="badge ${badgeCls}">${r.recommendation}</span></td>
              <td class="price">${r.target}</td>
              <td class="price">${r.last}</td>
              <td class="price ${upsideClass(uVal)}">${r.upside}</td>
              <td><a class="report-link" href="${r.url}" target="_blank" rel="noopener">View ↗</a></td>
            </tr>
          `;
        }).join('');

        return `
          <details class="ticker-card">
            <summary>
              <div class="ticker-main">
                <span class="ticker-code">${g.ticker}</span>
                <div class="ticker-info">
                  <div class="ticker-name">${g.company}</div>
                  <div class="ticker-meta">${g.reports.length} report${g.reports.length > 1 ? 's' : ''} · latest: ${g.reports[0].period}</div>
                </div>
              </div>
              <div class="ticker-right">
                <div class="upside-block">
                  <span class="upside-label">Upside potential</span>
                  <span class="best-upside ${bestCls}">${formatUpside(g.latestUpside)}</span>
                </div>
                <svg class="chevron" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
                </svg>
              </div>
            </summary>
            <div class="reports-panel">
              <table class="reports-table">
                <thead>
                  <tr>
                    <th>Period</th>
                    <th>Recommendation</th>
                    <th>Target</th>
                    <th>Last</th>
                    <th>Upside</th>
                    <th>Report</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          </details>
        `;
      }).join('');

      document.getElementById('ticker-count').textContent = groups.length + ' ticker' + (groups.length !== 1 ? 's' : '');
      document.getElementById('report-count').textContent = totalReports + ' report' + (totalReports !== 1 ? 's' : '');
    }

    let allGroups = groupByTicker(rawData);
    render(allGroups);

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        render(allGroups);
        return;
      }
      const filtered = allGroups.filter(g =>
        g.ticker.toLowerCase().includes(q) ||
        g.company.toLowerCase().includes(q)
      );
      render(filtered);
    });

    document.getElementById('expand-all').addEventListener('click', () => {
      document.querySelectorAll('details.ticker-card').forEach(d => d.open = true);
    });

    document.getElementById('collapse-all').addEventListener('click', () => {
      document.querySelectorAll('details.ticker-card').forEach(d => d.open = false);
    });
  </script>
</body>
</html>
